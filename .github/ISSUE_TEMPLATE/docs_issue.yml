name: Documentation problem
description: Something in the manual is wrong, missing or unclear
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      description: Link or folder name, for example gm-tools or dice.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Optional, how you would word it.
