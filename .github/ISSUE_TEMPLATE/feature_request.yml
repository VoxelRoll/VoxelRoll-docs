name: Feature request
description: Suggest an idea or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part of VoxelRoll is this about?
      options:
        - GM tools
        - Characters and sheets
        - Dice and rolls
        - Turns and combat
        - Worlds and moments
        - Campaigns and invites
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation at your table where this would help, not just the feature.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
      description: Any workaround you use today, or other tools that do this well.
